# Local stack: `cp .env.example .env`, fill in the secrets, then `docker compose up --build`.
# Open http://localhost:8080 (the gateway). Mongo arrives with the CCK/Marketplace service.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doggzi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      # TCP only: during first-run init Postgres listens on the socket only, so this stays
      # unhealthy until init.sql has finished and the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-doggzi} && psql -h 127.0.0.1 -U ${POSTGRES_USER:-doggzi} -d postgres -tAc 'select 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  pet-profile:
    restart: unless-stopped
    build: ./services/pet-profile
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-doggzi}:${POSTGRES_PASSWORD}@postgres:5432/pet_profile"
      REDIS_URL: redis://redis:6379/0
      GUEST_JWT_SECRET: ${GUEST_JWT_SECRET:?set GUEST_JWT_SECRET in .env}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }

  notification:
    restart: unless-stopped
    build: ./services/notification
    environment:
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      SMS_PROVIDER_API_KEY: ${SMS_PROVIDER_API_KEY:-}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}

  auth:
    restart: unless-stopped
    build: ./services/auth
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-doggzi}:${POSTGRES_PASSWORD}@postgres:5432/auth"
      REDIS_URL: redis://redis:6379/1
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      OTP_DEV_ECHO: ${OTP_DEV_ECHO:-true}
      NOTIFICATION_URL: http://notification:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      ADMIN_PHONES: ${ADMIN_PHONES:-}
      SESSION_REDIS_URL: redis://redis:6379/5
      SEED_DEMO: ${SEED_DEMO:-false}
    depends_on: { postgres: { condition: service_healthy }, notification: { condition: service_started } }

  booking:
    restart: unless-stopped
    build: ./services/booking
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-doggzi}:${POSTGRES_PASSWORD}@postgres:5432/booking"
      REDIS_URL: redis://redis:6379/2
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      MOCK_AVAILABILITY: "true"
      PET_PROFILE_URL: http://pet-profile:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      NOTIFICATION_URL: http://notification:8000
      SESSION_REDIS_URL: redis://redis:6379/5
      CODE_SECRET: ${CODE_SECRET:-}
      OPS_WHATSAPP: ${OPS_WHATSAPP:-}
      OFFER_TTL_SECONDS: ${OFFER_TTL_SECONDS:-90}
      SEED_DEMO: ${SEED_DEMO:-false}
    depends_on: { postgres: { condition: service_healthy } }

  market:
    restart: unless-stopped
    build: ./services/market
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-doggzi}:${POSTGRES_PASSWORD}@postgres:5432/market"
      REDIS_URL: redis://redis:6379/3
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      PAYMENTS_MODE: ${PAYMENTS_MODE:-mock}
      SESSION_REDIS_URL: redis://redis:6379/5
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      AUTH_URL: http://auth:8000
      NOTIFICATION_URL: http://notification:8000
      CODE_SECRET: ${CODE_SECRET:-}
      OPS_WHATSAPP: ${OPS_WHATSAPP:-}
      SEED_DEMO: ${SEED_DEMO:-false}
    depends_on: { postgres: { condition: service_healthy } }

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment: {}

  console:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/console/Dockerfile

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["8080:80"]
    environment:
      PET_PROFILE_UPSTREAM: pet-profile:8000
      BOOKING_UPSTREAM: booking:8000
      AUTH_UPSTREAM: auth:8000
      MARKET_UPSTREAM: market:8000
      WEB_UPSTREAM: web:80
      CONSOLE_UPSTREAM: console:80
      DNS_RESOLVER: 127.0.0.11
    volumes:
      - ./infra/nginx/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on: [web, console, pet-profile, booking, auth, market]

volumes:
  pgdata:
