server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

  location /console/assets/ {
    alias /usr/share/nginx/html/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location = /console/sw.js { alias /usr/share/nginx/html/sw.js; add_header Cache-Control "no-cache"; }
  location /console/ {
    alias /usr/share/nginx/html/;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /console/index.html;
  }
  location = /console { return 301 /console/; }
}
