server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json font/ttf;

  # Vite's hashed bundles never change under the same name: cache for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location /brand/ { expires 7d; add_header Cache-Control "public"; }
  # The SPA shell must always be revalidated so a deploy is picked up immediately.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
