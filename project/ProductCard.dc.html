<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<article data-card="{{ item.sku }}" style="height:100%;display:flex;flex-direction:column;gap:8px;padding:10px 10px 12px;background:#FFFBF2;border:2.5px solid #141210;border-radius:22px;box-shadow:4px 4px 0 #141210;min-width:0">
  <button type="button" onClick="{{ item.open }}" aria-label="{{ item.openLabel }}" style="display:block;padding:0;border:0;background:transparent;border-radius:18px;cursor:pointer;text-align:left" style-focus="outline:3px solid #F65322;outline-offset:3px">
    <dc-import name="CategoryTile" category="{{ item.category }}" brand="{{ item.brand }}" muted="{{ item.muted }}" force-reduced-motion="{{ forceReducedMotion }}" hint-size="100%,150px"></dc-import>
  </button>
  <h3 style="margin:0;font-size:14px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em">{{ item.name }}</h3>
  <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
    <span style="font-family:Atma,system-ui;font-weight:700;font-size:20px">{{ item.price }}</span>
    <sc-if value="{{ item.hasMrp }}" hint-placeholder-val="{{ false }}"><s style="font-size:13px;color:rgba(20,18,16,.65)">MRP {{ item.mrp }}</s></sc-if>
  </div>
  <span style="align-self:flex-start;font-size:12px;font-weight:500;padding:2px 8px;border:1.5px solid #141210;border-radius:999px;background:#F2E7CB;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis">{{ item.store }}</span>
  <sc-if value="{{ item.inStock }}" hint-placeholder-val="{{ true }}">
    <button type="button" onClick="{{ item.add }}" aria-label="{{ item.addLabel }}" style="margin-top:auto;height:44px;font:600 15px Poppins,system-ui;color:#141210;background:{{ item.btnBg }};border:2.5px solid #141210;border-radius:999px;box-shadow:3px 3px 0 #141210;cursor:pointer;transition:transform 180ms cubic-bezier(.34,1.56,.64,1),box-shadow 180ms cubic-bezier(.34,1.56,.64,1)" style-hover="transform:translateY(-2px);box-shadow:5px 5px 0 #141210" style-active="transform:translate(3px,3px);box-shadow:0 0 0 #141210" style-focus="outline:3px solid #F65322;outline-offset:3px">{{ item.btnLabel }}</button>
  </sc-if>
  <sc-if value="{{ item.outOfStock }}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{ item.notify }}" aria-pressed="{{ item.notifiedAttr }}" style="margin-top:auto;height:44px;font:600 14px Poppins,system-ui;color:#141210;background:#E4DDCB;border:2px dashed #141210;border-radius:999px;cursor:pointer" style-focus="outline:3px solid #F65322;outline-offset:3px">{{ item.notifyLabel }}</button>
  </sc-if>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:380},&quot;item&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;forceReducedMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}"></script>
</body>
</html>
