<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div ref="{{ hostRef }}" role="img" aria-label="{{ label }}" style="position:relative;width:100%;aspect-ratio:6/5"></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:300},&quot;scene&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;bath&quot;,&quot;dry&quot;,&quot;trim&quot;,&quot;style&quot;,&quot;bathdry&quot;,&quot;pompom&quot;,&quot;massage&quot;,&quot;medbath&quot;,&quot;dental&quot;,&quot;dematLight&quot;,&quot;dematNormal&quot;,&quot;oil&quot;,&quot;fulltrim&quot;,&quot;breed&quot;,&quot;training&quot;,&quot;boarding&quot;,&quot;pickup&quot;],&quot;default&quot;:&quot;bath&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sequence&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pet&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dog&quot;,&quot;puppy&quot;,&quot;cat&quot;],&quot;default&quot;:&quot;dog&quot;,&quot;tsType&quot;:&quot;'dog' | 'puppy' | 'cat'&quot;},&quot;petName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Bruno&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onStep&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(i: number) =&gt; void&quot;},&quot;forceReducedMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const NS = 'http://www.w3.org/2000/svg';
const D = 2600;
const EASE = 'cubic-bezier(0.22, 1, 0.36, 1)';
const BOUNCY = 'cubic-bezier(0.34, 1.56, 0.64, 1)';
const C = '#FFFBF2', C2 = '#F2E7CB', INK = '#141210', OR = '#F65322', GR = '#09A460', PK = '#F989EF';
const FB = 'style="transform-box:fill-box;transform-origin:center"';
const FBB = 'style="transform-box:fill-box;transform-origin:50% 100%"';

const ensureSprite = () => window.__dzsSprite || (window.__dzsSprite = fetch('assets/pets-trio.svg').then(r => r.text()).then(t => {
  const holder = document.createElementNS(NS, 'svg');
  holder.setAttribute('aria-hidden', 'true');
  holder.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden';
  const doc = new DOMParser().parseFromString(t, 'image/svg+xml');
  doc.querySelectorAll('*').forEach(n => { if (n.namespaceURI !== NS || n.tagName === 'metadata') n.remove(); });
  [...doc.documentElement.children].forEach(c => holder.appendChild(document.importNode(c, true)));
  document.body.appendChild(holder);
  const vb = {};
  [['dog', 'lab'], ['puppy', 'puppy'], ['cat', 'cat']].forEach(([k, id]) => { const el = holder.querySelector('#' + id); el.id = 'dzs-' + id; const b = el.getBBox(), p = 4; vb[k] = `${b.x - p} ${b.y - p} ${b.width + p * 2} ${b.height + p * 2}`; });
  holder.querySelectorAll('[id]').forEach(el => { if (!el.id.startsWith('dzs-')) el.removeAttribute('id'); });
  return vb;
}));

// ---------- reusable prop library ----------
const at = (x, y, inner, attr = '') => `<g transform="translate(${x} ${y})"><g ${attr}>${inner}</g></g>`;
const P = {
  tub: (x, y, w = 120) => at(x, y, `<path d="M0 0h${w}v14c0 20-15 32-34 32H34C15 46 0 34 0 14z" fill="${C}"/><path d="M-6 0h${w + 12}" fill="none"/><path d="M16 46l-5 10M${w - 16} 46l5 10" fill="none"/><path d="M14 14h${w - 28}" fill="none" stroke-width="1.6"/>`),
  shower: (x, y) => at(x, y, `<path d="M0 0v-30h26" fill="none"/><path d="M26 -36h18l4 10H22z" fill="${C}"/><path d="M28 -20l-2 6M35 -20v6M42 -20l2 6" fill="none" stroke-width="1.8"/>`),
  bubble: (x, y, r, fill = C, tag = 'bubble') => `<circle data-a="${tag}" cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${FB}/>`,
  drop: (x, y, tag = 'drop') => at(x, y, `<path d="M0 -8C0 -8 -5 -1 -5 2a5 5 0 0 0 10 0C5 -1 0 -8 0 -8z" fill="${C}" stroke-width="1.8"/>`, `data-a="${tag}" ${FB}`),
  dryer: (x, y) => at(x, y, `<circle cx="0" cy="0" r="16" fill="${OR}"/><path d="M-12 -6h-24v12h24" fill="${C}"/><path d="M4 14l6 30h10l-4-32" fill="${C}"/><circle cx="0" cy="0" r="6" fill="${C}"/>`, `data-a="dryer" ${FB}`),
  air: (x, y, tag = 'air') => [0, 1, 2].map(i => at(x, y + i * 12, `<path d="M0 0c-8-4-14 4-22 0s-14 4-22 0" fill="none" stroke-width="2"/>`, `data-a="${tag}" ${FB}`)).join(''),
  scissors: (x, y, tag = 'scissors') => at(x, y, `<g data-a="bladeA" style="transform-box:view-box;transform-origin:0px 0px"><path d="M0 0L-30 -6" fill="none" stroke-width="3"/><circle cx="12" cy="4" r="6" fill="${C}"/></g><g data-a="bladeB" style="transform-box:view-box;transform-origin:0px 0px"><path d="M0 0L-30 6" fill="none" stroke-width="3"/><circle cx="12" cy="-4" r="6" fill="${C}"/></g><circle cx="0" cy="0" r="2" fill="${INK}"/>`, `data-a="${tag}"`),
  hair: (x, y, tag = 'hair') => at(x, y, `<path d="M0 0c3 3 3 7 0 10" fill="none" stroke-width="2"/>`, `data-a="${tag}" ${FB}`),
  comb: (x, y) => at(x, y, `<rect x="0" y="0" width="54" height="10" rx="3" fill="${PK}"/><path d="M6 10v10M14 10v10M22 10v10M30 10v10M38 10v10M46 10v10" fill="none" stroke-width="2"/>`, `data-a="comb"`),
  knot: (x, y, s = 1, tag = 'knot') => at(x, y, `<path d="M-14 0c6-10 14 8 8 10s-12-14 0-14 10 18 2 16-10-12 4-14 12 6 14 2" fill="none" stroke-width="2.2" transform="scale(${s})"/>`, `data-a="${tag}" ${FB}`),
  strand: (x, y, w, tag = 'strand') => `<path data-a="${tag}" d="M${x} ${y}h${w}" fill="none" stroke-width="2.2" style="transform-box:fill-box;transform-origin:0% 50%"/>`,
  hands: (x, y) => at(x, y, `<path d="M0 0c0-10 8-16 16-12l10 6c4 3 2 8-2 8H6C2 2 0 2 0 0z" fill="${C}"/><path d="M30 6c0-10 8-16 16-12l10 6c4 3 2 8-2 8H36c-4 0-6 0-6-2z" fill="${C}"/>`, `data-a="hands"`),
  heart: (x, y) => at(x, y, `<path d="M0 4C-8-4-14 4-8 10L0 16l8-6c6-6 0-14-8-6z" fill="${PK}" stroke-width="1.8"/>`, `data-a="heart" ${FB}`),
  oil: (x, y) => at(x, y, `<path d="M0 -14C0 -14 -10 0 -10 6a10 10 0 0 0 20 0C10 0 0 -14 0 -14z" fill="${OR}"/><path d="M-4 6a4 4 0 0 0 4 4" fill="none" stroke="${C}" stroke-width="2"/>`, `data-a="oil" ${FB}`),
  waves: (x, y) => [0, 1].map(i => at(x, y + i * 14, `<path d="M0 0c10-8 20 8 30 0s20 8 30 0 20 8 30 0" fill="none" stroke-width="2"/>`, `data-a="wave" ${FB}`)).join(''),
  toothbrush: (x, y) => at(x, y, `<rect x="0" y="-3" width="46" height="7" rx="3" fill="${GR}"/><rect x="-14" y="-12" width="16" height="9" rx="2" fill="${C}"/><path d="M-12 -12v-5M-7 -12v-5M-2 -12v-5" fill="none" stroke-width="1.8"/>`, `data-a="brush"`),
  sparkle: (x, y, s = 1, tag = 'sparkle') => at(x, y, `<path d="M0 -10C1 -3 3 -1 10 0C3 1 1 3 0 10C-1 3 -3 1 -10 0C-3 -1 -1 -3 0 -10z" fill="${C}" stroke-width="1.8" transform="scale(${s})"/>`, `data-a="${tag}" ${FB}`),
  mirror: (x, y) => at(x, y, `<ellipse cx="0" cy="0" rx="22" ry="30" fill="${C2}"/><ellipse cx="0" cy="0" rx="16" ry="24" fill="${C}"/><path d="M0 30v14M-12 44h24" fill="none"/><g data-a="shine" ${FB}><path d="M-8 -12l10 -8M-6 -2l14 -12" fill="none" stroke-width="2"/></g>`),
  pompom: (x, y) => at(x, y, `<path d="M0 -9c4-4 9 0 8 4 5 1 5 8 0 9 1 5-5 7-8 4-3 3-9 1-8-4-5-1-5-8 0-9-1-4 4-8 8-4z" fill="${PK}" stroke-width="2"/>`, `data-a="pompom" ${FB}`),
  bottle: (x, y) => at(x, y, `<rect x="-14" y="-10" width="28" height="40" rx="6" fill="${C}"/><rect x="-6" y="-20" width="12" height="10" fill="${C}"/><path d="M0 2v16M-8 10h16" fill="none" stroke="${GR}" stroke-width="4"/>`, `data-a="bottle" style="transform-box:fill-box;transform-origin:50% 100%"`),
  house: (x, y) => at(x, y, `<path d="M0 40L46 0l46 40" fill="none"/><path d="M8 34v62h76V34" fill="${C}"/><path d="M34 96V64h24v32" fill="${C2}"/><rect x="58" y="44" width="16" height="14" fill="${C2}"/>`),
  moon: (x, y) => at(x, y, `<path d="M8 -14a16 16 0 1 0 6 26a13 13 0 1 1 -6 -26z" fill="${C}"/>`, `data-a="moon" ${FB}`),
  z: (x, y, s = 14) => `<text data-a="z" x="${x}" y="${y}" font-family="Atma,system-ui" font-weight="700" font-size="${s}" fill="${INK}" stroke="none" ${FB}>z</text>`,
  van: (x, y) => at(x, y, `<path d="M2 8h44v30H2z" fill="${C}"/><path d="M46 14h14l10 12v12H46z" fill="${OR}"/><path d="M50 17h8l6 9H50z" fill="${C2}" stroke-width="2"/><circle cx="16" cy="40" r="6.5" fill="${INK}"/><circle cx="58" cy="40" r="6.5" fill="${INK}"/><path d="M18 16v12M12 22h12" stroke="${GR}" stroke-width="3"/>`, `data-a="van"`),
  door: (x, y) => at(x, y, `<path d="M0 70V8a6 6 0 0 1 6-6h30a6 6 0 0 1 6 6v62z" fill="${PK}"/><circle cx="32" cy="38" r="3" fill="${INK}"/><path d="M-10 70h62" fill="none"/>`),
  ball: (x, y) => at(x, y, `<circle cx="0" cy="0" r="10" fill="${OR}"/><path d="M-9 -4c6 4 12 4 18 0M-9 4c6-4 12-4 18 0" fill="none" stroke-width="1.8"/>`, `data-a="ball" ${FB}`),
  whistle: (x, y) => at(x, y, `<path d="M0 0h22a10 10 0 1 1 -10 10H0z" fill="${C}"/><path d="M-6 -2v14" fill="none"/>`),
  stamp: (x, y) => at(x, y, `<circle cx="0" cy="0" r="18" fill="${GR}"/><path d="M-8 0l5 6 11-12" fill="none" stroke="${C}" stroke-width="3.4"/>`, `data-a="stamp" ${FB}`),
  ground: () => `<path d="M16 172h208" fill="none" stroke-width="2" stroke-dasharray="2 8"/>`,
};

// ---------- scenes: markup + animation ----------
const pet = (vb, id, x, y, w, h) => `<g data-a="pet" ${FBB}><svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="${vb}" preserveAspectRatio="xMidYMax meet" overflow="visible"><use href="#dzs-${id}"/></svg></g>`;
const loop = (o = {}) => ({ duration: o.d || D, iterations: Infinity, easing: o.e || 'ease-in-out', delay: o.delay || 0, fill: 'both' });
const each = (root, tag, fn) => [...root.querySelectorAll(`[data-a="${tag}"]`)].map((el, i) => fn(el, i)).filter(Boolean);
const rise = (dy = -50) => [{ transform: 'translateY(0) scale(.4)', opacity: 0 }, { opacity: 1, offset: 0.2 }, { transform: `translateY(${dy}px) scale(1)`, opacity: 0 }];
const pop = [{ transform: 'scale(0)', opacity: 0 }, { transform: 'scale(1.15)', opacity: 1, offset: 0.12 }, { transform: 'scale(1)', opacity: 1, offset: 0.2 }, { transform: 'scale(1)', opacity: 1, offset: 0.85 }, { transform: 'scale(0)', opacity: 0 }];
const snip = (root) => [...each(root, 'bladeA', el => el.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(14deg)' }, { transform: 'rotate(0)' }], { duration: 360, iterations: Infinity })), ...each(root, 'bladeB', el => el.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-14deg)' }, { transform: 'rotate(0)' }], { duration: 360, iterations: Infinity }))];

const SCENES = {
  bath: {
    label: 'bath time in a tub with bubbles',
    svg: (v, id) => pet(v, id, 62, 26, 116, 120) + [[80, 118, 6], [100, 112, 4], [128, 116, 7], [150, 110, 5], [168, 118, 4], [114, 120, 5]].map(b => P.bubble(...b)).join('') + P.tub(60, 122) + [[96, 70], [150, 66], [84, 96], [164, 92]].map(d => P.drop(...d)).join('') + P.ground(),
    anim: r => [
      ...each(r, 'bubble', (el, i) => el.animate(rise(-46 - (i % 3) * 10), loop({ d: 1800 + i * 160, delay: i * 220 }))),
      ...each(r, 'pet', el => el.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(0)', offset: 0.6 }, { transform: 'rotate(-5deg)', offset: 0.66 }, { transform: 'rotate(5deg)', offset: 0.72 }, { transform: 'rotate(-4deg)', offset: 0.78 }, { transform: 'rotate(0)', offset: 0.84 }, { transform: 'rotate(0)' }], loop())),
      ...each(r, 'drop', (el, i) => el.animate([{ transform: 'translate(0,0)', opacity: 0 }, { transform: 'translate(0,0)', opacity: 0, offset: 0.64 }, { opacity: 1, offset: 0.68 }, { transform: `translate(${i % 2 ? 26 : -26}px,${-10 - i * 4}px)`, opacity: 0, offset: 0.9 }, { opacity: 0 }], loop())),
    ],
  },
  dry: {
    label: 'blow drying with warm air',
    svg: (v, id) => pet(v, id, 40, 34, 120, 130) + P.dryer(200, 70) + P.air(172, 58) + P.ground(),
    anim: r => [
      ...each(r, 'air', (el, i) => el.animate([{ transform: 'translateX(0)', opacity: 0 }, { opacity: 1, offset: 0.2 }, { transform: 'translateX(-40px)', opacity: 0 }], loop({ d: 900, delay: i * 200, e: 'linear' }))),
      ...each(r, 'dryer', el => el.animate([{ transform: 'rotate(-4deg)' }, { transform: 'rotate(4deg)' }, { transform: 'rotate(-4deg)' }], loop({ d: 1300 }))),
      ...each(r, 'pet', el => el.animate([{ transform: 'skewX(0deg)' }, { transform: 'skewX(-2deg)' }, { transform: 'skewX(0deg)' }], loop({ d: 900 }))),
    ],
  },
  trim: {
    label: 'a hair trim with scissors',
    svg: (v, id) => pet(v, id, 40, 34, 120, 130) + P.scissors(176, 66) + [[150, 80], [160, 76], [144, 90], [166, 88], [156, 96]].map(h => P.hair(...h)).join('') + P.ground(),
    anim: r => [
      ...snip(r),
      ...each(r, 'scissors', el => el.animate([{ transform: 'translate(0,0)' }, { transform: 'translate(-30px,14px)' }, { transform: 'translate(0,0)' }], loop())),
      ...each(r, 'hair', (el, i) => el.animate([{ transform: 'translateY(0) rotate(0)', opacity: 0 }, { opacity: 1, offset: 0.15 }, { transform: `translateY(${60 - i * 4}px) rotate(${i % 2 ? 60 : -60}deg)`, opacity: 0 }], loop({ d: 1600, delay: i * 280, e: 'ease-in' }))),
    ],
  },
  style: {
    label: 'face styling in front of a mirror',
    svg: (v, id) => pet(v, id, 30, 40, 116, 124) + P.mirror(196, 90) + P.scissors(118, 44, 'scissors') + P.sparkle(70, 38, 0.8) + P.sparkle(140, 78, 0.6) + P.ground(),
    anim: r => [
      ...snip(r),
      ...each(r, 'scissors', el => el.animate([{ transform: 'translate(0,0) rotate(0)' }, { transform: 'translate(-24px,-6px) rotate(-10deg)' }, { transform: 'translate(-6px,10px) rotate(8deg)' }, { transform: 'translate(0,0) rotate(0)' }], loop())),
      ...each(r, 'shine', el => el.animate([{ transform: 'translate(-6px,6px)', opacity: 0 }, { opacity: 1, offset: 0.4 }, { transform: 'translate(6px,-6px)', opacity: 0 }], loop({ d: 1600 }))),
      ...each(r, 'sparkle', (el, i) => el.animate(pop, loop({ delay: i * 500 }))),
    ],
  },
  bathdry: {
    label: 'bath with bubbles, then a blow dry',
    svg: (v, id) => pet(v, id, 48, 26, 116, 120) + [[66, 118, 6], [90, 112, 4], [118, 116, 6], [140, 110, 5]].map(b => P.bubble(...b)).join('') + P.tub(46, 122) + P.dryer(214, 66) + P.air(186, 54) + P.ground(),
    anim: r => [
      ...each(r, 'bubble', (el, i) => el.animate(rise(), loop({ d: 1900, delay: i * 260 }))),
      ...each(r, 'air', (el, i) => el.animate([{ transform: 'translateX(0)', opacity: 0 }, { opacity: 1, offset: 0.2 }, { transform: 'translateX(-36px)', opacity: 0 }], loop({ d: 900, delay: i * 200, e: 'linear' }))),
    ],
  },
  pompom: {
    label: 'pom-poms pop onto the legs for a poodle look',
    svg: (v, id) => pet(v, id, 50, 30, 140, 140) + [[78, 164], [102, 168], [140, 168], [166, 164]].map(p => P.pompom(...p)).join('') + P.ground(),
    anim: r => each(r, 'pompom', (el, i) => el.animate(pop, loop({ delay: i * 180, e: BOUNCY }))),
  },
  massage: {
    label: 'a gentle body massage with hearts',
    svg: (v, id) => pet(v, id, 50, 40, 140, 130) + P.hands(96, 62) + [[80, 50], [150, 44], [118, 30]].map(h => P.heart(...h)).join('') + P.ground(),
    anim: r => [
      ...each(r, 'hands', el => el.animate([{ transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(-8px)' }], loop({ d: 900 }))),
      ...each(r, 'heart', (el, i) => el.animate(rise(-34), loop({ d: 2000, delay: i * 500 }))),
    ],
  },
  medbath: {
    label: 'a medicated bath with green bubbles',
    svg: (v, id) => pet(v, id, 44, 26, 116, 120) + [[62, 118, 6, GR], [86, 112, 4, GR], [112, 116, 6, GR], [134, 110, 5, GR]].map(b => P.bubble(...b)).join('') + P.tub(40, 122) + P.bottle(200, 96) + P.ground(),
    anim: r => [
      ...each(r, 'bubble', (el, i) => el.animate(rise(), loop({ d: 2000, delay: i * 300 }))),
      ...each(r, 'bottle', el => el.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-28deg)', offset: 0.3 }, { transform: 'rotate(-28deg)', offset: 0.6 }, { transform: 'rotate(0)', offset: 0.8 }, { transform: 'rotate(0)' }], loop())),
    ],
  },
  dental: {
    label: 'teeth cleaning with a toothbrush and sparkles',
    svg: (v, id) => pet(v, id, 60, 30, 130, 136) + P.toothbrush(44, 92) + P.sparkle(40, 66, 0.8) + P.sparkle(70, 112, 0.6) + P.sparkle(28, 104, 0.5) + P.ground(),
    anim: r => [
      ...each(r, 'brush', el => el.animate([{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(-6px)' }], { duration: 300, iterations: Infinity })),
      ...each(r, 'sparkle', (el, i) => el.animate(pop, loop({ d: 1800, delay: i * 400, e: BOUNCY }))),
    ],
  },
  dematLight: {
    label: 'a comb glides through and a small knot untangles',
    svg: (v, id) => pet(v, id, 40, 36, 124, 130) + P.knot(150, 96, 0.8) + P.strand(136, 96, 30) + P.comb(176, 72) + P.ground(),
    anim: r => [
      ...each(r, 'comb', el => el.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-44px)', offset: 0.6 }, { transform: 'translateX(0)' }], loop())),
      ...each(r, 'knot', el => el.animate([{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(1)', opacity: 1, offset: 0.35 }, { transform: 'scale(.2)', opacity: 0, offset: 0.6 }, { opacity: 0, offset: 0.9 }, { transform: 'scale(1)', opacity: 1 }], loop())),
      ...each(r, 'strand', el => el.animate([{ transform: 'scaleX(0)', opacity: 0 }, { transform: 'scaleX(0)', opacity: 0, offset: 0.5 }, { transform: 'scaleX(1)', opacity: 1, offset: 0.7 }, { transform: 'scaleX(1)', opacity: 1, offset: 0.9 }, { transform: 'scaleX(0)', opacity: 0 }], loop())),
    ],
  },
  dematNormal: {
    label: 'a comb pulls a big knot until it unravels into a straight line',
    svg: (v, id) => pet(v, id, 30, 36, 124, 130) + P.knot(160, 98, 1.5) + P.strand(130, 100, 70) + P.comb(186, 70) + P.ground(),
    anim: r => [
      ...each(r, 'comb', el => el.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-30px)', offset: 0.3 }, { transform: 'translateX(-6px)', offset: 0.4 }, { transform: 'translateX(-50px)', offset: 0.65 }, { transform: 'translateX(0)' }], loop())),
      ...each(r, 'knot', el => el.animate([{ transform: 'scale(1) rotate(0)', opacity: 1 }, { transform: 'scale(1.1) rotate(20deg)', offset: 0.3 }, { transform: 'scaleX(1.8) scaleY(.2)', opacity: 0, offset: 0.6 }, { opacity: 0, offset: 0.9 }, { transform: 'scale(1)', opacity: 1 }], loop())),
      ...each(r, 'strand', el => el.animate([{ transform: 'scaleX(0)', opacity: 0 }, { transform: 'scaleX(0)', opacity: 0, offset: 0.5 }, { transform: 'scaleX(1)', opacity: 1, offset: 0.72 }, { transform: 'scaleX(1)', opacity: 1, offset: 0.9 }, { transform: 'scaleX(0)', opacity: 0 }], loop())),
    ],
  },
  oil: {
    label: 'a calming oil massage, eyes slowly closing',
    svg: (v, id) => pet(v, id, 50, 40, 140, 130) + P.oil(120, 24) + P.waves(24, 60) + P.waves(170, 70) + `<g data-a="eyes" ${FB}>${at(196, 36, `<path d="M0 0c4 4 10 4 14 0M22 0c4 4 10 4 14 0" fill="none" stroke-width="2.2"/>`)}</g>` + P.ground(),
    anim: r => [
      ...each(r, 'oil', el => el.animate([{ transform: 'translateY(-10px)', opacity: 0 }, { opacity: 1, offset: 0.15 }, { transform: 'translateY(30px)', opacity: 1, offset: 0.5 }, { transform: 'translateY(34px) scale(1.4,.4)', opacity: 0, offset: 0.6 }, { opacity: 0 }], loop({ e: 'ease-in' }))),
      ...each(r, 'wave', (el, i) => el.animate([{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(-6px)' }], loop({ d: 3200, delay: i * 400 }))),
      ...each(r, 'pet', el => el.animate([{ transform: 'scaleY(1)' }, { transform: 'scaleY(1.025)' }, { transform: 'scaleY(1)' }], loop({ d: 3200 }))),
      ...each(r, 'eyes', el => el.animate([{ transform: 'scaleY(0)', opacity: 0 }, { transform: 'scaleY(0)', opacity: 0, offset: 0.4 }, { transform: 'scaleY(1)', opacity: 1, offset: 0.7 }, { transform: 'scaleY(1)', opacity: 1 }], loop({ d: 3200 }))),
    ],
  },
  fulltrim: {
    label: 'a full body hair trim with hair falling',
    svg: (v, id) => pet(v, id, 40, 36, 130, 130) + P.scissors(190, 56) + [[140, 70], [160, 64], [120, 76], [176, 80], [150, 86], [104, 84], [132, 92]].map(h => P.hair(...h)).join('') + P.ground(),
    anim: r => [
      ...snip(r),
      ...each(r, 'scissors', el => el.animate([{ transform: 'translate(0,0)' }, { transform: 'translate(-80px,10px)', offset: 0.5 }, { transform: 'translate(0,0)' }], loop())),
      ...each(r, 'hair', (el, i) => el.animate([{ transform: 'translateY(0) rotate(0)', opacity: 0 }, { opacity: 1, offset: 0.15 }, { transform: `translateY(${70 - i * 3}px) rotate(${i % 2 ? 80 : -80}deg)`, opacity: 0 }], loop({ d: 1500, delay: i * 200, e: 'ease-in' }))),
    ],
  },
  breed: {
    label: 'breed styling with sparkles',
    svg: (v, id, name) => pet(v, id, 50, 40, 140, 130) + [[40, 50], [200, 46], [210, 120], [30, 120]].map(([x, y], i) => P.sparkle(x, y, 0.8 + (i % 2) * 0.3)).join('') + at(120, 30, `<rect x="-64" y="-14" width="128" height="26" rx="13" fill="${PK}"/><text x="0" y="5" text-anchor="middle" font-family="Atma,system-ui" font-weight="700" font-size="13" letter-spacing="1" fill="${INK}" stroke="none">${(name || 'BRUNO').toUpperCase().slice(0, 10)}-STYLE</text>`, `data-a="tag" ${FB}`) + P.ground(),
    anim: r => [
      ...each(r, 'sparkle', (el, i) => el.animate(pop, loop({ delay: i * 300, e: BOUNCY }))),
      ...each(r, 'tag', el => el.animate([{ transform: 'scale(0) rotate(-10deg)' }, { transform: 'scale(1.1) rotate(-4deg)', offset: 0.15 }, { transform: 'scale(1) rotate(-4deg)', offset: 0.22 }, { transform: 'scale(1) rotate(-4deg)', offset: 0.9 }, { transform: 'scale(0) rotate(-10deg)' }], loop({ e: BOUNCY }))),
    ],
  },
  training: {
    label: 'training: a ball bounces, the pet sits, session counter ticks to 12',
    svg: (v, id) => pet(v, id, 76, 34, 124, 130) + P.ball(46, 150) + P.whistle(22, 40) + P.stamp(206, 40) + at(196, 150, `<rect x="-22" y="-16" width="44" height="26" rx="8" fill="${C}"/><text data-count="" x="0" y="3" text-anchor="middle" font-family="Atma,system-ui" font-weight="700" font-size="16" fill="${INK}" stroke="none">12</text>`) + P.ground(),
    anim: r => [
      ...each(r, 'ball', el => el.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-60px)', offset: 0.2, easing: 'ease-in' }, { transform: 'translateY(0)', offset: 0.4 }, { transform: 'translateY(-24px)', offset: 0.5, easing: 'ease-in' }, { transform: 'translateY(0)', offset: 0.6 }, { transform: 'translateY(0)' }], loop({ e: 'ease-out' }))),
      ...each(r, 'pet', el => el.animate([{ transform: 'scaleY(1)' }, { transform: 'scaleY(1)', offset: 0.55 }, { transform: 'scaleY(.9)', offset: 0.65 }, { transform: 'scaleY(.9)', offset: 0.9 }, { transform: 'scaleY(1)' }], loop())),
      ...each(r, 'stamp', el => el.animate([{ transform: 'scale(0)', opacity: 0 }, { transform: 'scale(0)', opacity: 0, offset: 0.66 }, { transform: 'scale(1.2)', opacity: 1, offset: 0.74 }, { transform: 'scale(1)', opacity: 1, offset: 0.8 }, { transform: 'scale(1)', opacity: 1, offset: 0.95 }, { transform: 'scale(0)', opacity: 0 }], loop())),
    ],
    tick: r => { const t = r.querySelector('[data-count]'); if (!t) return null; let n = 0; return setInterval(() => { n = n >= 12 ? 1 : n + 1; t.textContent = n; }, 260); },
  },
  boarding: {
    label: 'boarding: a cosy house at night, the pet sleeping',
    svg: (v, id) => P.house(14, 70) + P.moon(200, 30) + pet(v, id, 110, 60, 110, 108) + P.z(150, 70, 14) + P.z(162, 56, 17) + P.z(176, 40, 20) + P.ground(),
    anim: r => [
      ...each(r, 'z', (el, i) => el.animate([{ transform: 'translate(0,0)', opacity: 0 }, { opacity: 1, offset: 0.3 }, { transform: 'translate(10px,-18px)', opacity: 0 }], loop({ d: 2400, delay: i * 500 }))),
      ...each(r, 'pet', el => el.animate([{ transform: 'scaleY(1)' }, { transform: 'scaleY(1.03)' }, { transform: 'scaleY(1)' }], loop({ d: 2600 }))),
      ...each(r, 'moon', el => el.animate([{ transform: 'rotate(-6deg)' }, { transform: 'rotate(6deg)' }, { transform: 'rotate(-6deg)' }], loop({ d: 4000 }))),
    ],
  },
  pickup: {
    label: 'pickup: the van drives to the door',
    svg: (v, id) => P.door(180, 98) + pet(v, id, 168, 106, 40, 62) + P.van(20, 128) + P.ground(),
    anim: r => [
      ...each(r, 'van', el => el.animate([{ transform: 'translateX(-90px)', opacity: 0 }, { opacity: 1, offset: 0.1 }, { transform: 'translateX(70px)', offset: 0.6, easing: 'ease-out' }, { transform: 'translateX(70px)', opacity: 1, offset: 0.9 }, { transform: 'translateX(70px)', opacity: 0 }], loop({ e: 'ease-in-out' }))),
    ],
  },
};
SCENES.hero = SCENES.bath;

class Component extends DCLogic {
  hostRef = React.createRef();
  state = { step: 0, vb: null };

  reduced() { return !!this.props.forceReducedMotion || window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  seq() { const s = this.props.sequence; return s ? String(s).split(',').map(x => x.trim()).filter(Boolean) : null; }
  current() { const q = this.seq(); return q ? q[(this.stepNow ?? this.state.step) % q.length] : (this.props.scene || 'bath'); }

  componentDidMount() {
    ensureSprite().then(vb => { this.vbs = vb; this.draw(); });
    this.io = new IntersectionObserver(([e]) => { if (this.visible === e.isIntersecting) return; this.visible = e.isIntersecting; this.sync(); }, { threshold: 0.15 });
    this.io.observe(this.hostRef.current);
  }
  componentWillUnmount() { this.io && this.io.disconnect(); this.stop(); clearInterval(this.seqT); }
  componentDidUpdate(pp, ps) {
    if (pp.scene !== this.props.scene || pp.pet !== this.props.pet || pp.sequence !== this.props.sequence || pp.petName !== this.props.petName || pp.forceReducedMotion !== this.props.forceReducedMotion) this.draw();
  }

  stop() { (this.anims || []).forEach(a => a.cancel()); this.anims = []; clearInterval(this.tickT); this.tickT = null; }

  draw() {
    const host = this.hostRef.current; if (!host || !this.vbs) return;
    this.stop();
    const key = this.current(), sc = SCENES[key] || SCENES.bath;
    const petKey = this.props.pet || 'dog', id = { dog: 'lab', puppy: 'puppy', cat: 'cat' }[petKey] || 'lab';
    host.innerHTML = `<svg viewBox="0 0 240 200" width="100%" height="100%" style="display:block;overflow:visible" fill="${C}" stroke="${INK}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${sc.svg(this.vbs[petKey] || this.vbs.dog, id, this.props.petName)}</svg>`;
    if (this.reduced()) return;
    const root = host.firstChild;
    this.anims = sc.anim(root);
    if (this.seq() && this.drawStep) this.anims.push(root.animate([{ opacity: 0, transform: 'translateX(12px)' }, { opacity: 1, transform: 'none' }], { duration: 350, easing: EASE }));
    this.sync();
  }

  sync() {
    const run = this.visible && !this.reduced();
    (this.anims || []).forEach(a => run ? a.play() : a.pause());
    const sc = SCENES[this.current()];
    if (run && sc && sc.tick && !this.tickT) this.tickT = sc.tick(this.hostRef.current);
    if (!run && this.tickT) { clearInterval(this.tickT); this.tickT = null; }
    const q = this.seq();
    if (q && run && !this.seqT) {
      this.emit(this.state.step % q.length);
      this.seqT = setInterval(() => { this.stepNow = ((this.stepNow ?? this.state.step) + 1) % q.length; this.setState({ step: this.stepNow }); this.drawStep = true; this.draw(); this.emit(this.stepNow); }, D);
    }
    if ((!q || !run) && this.seqT) { clearInterval(this.seqT); this.seqT = null; }
  }

  emit(i) {
    const h = this.hostRef.current;
    if (this.lastDispatched === i && this.seqT) return;
    this.lastDispatched = i;
    if (h) h.dispatchEvent(new CustomEvent('dzstep', { bubbles: true, detail: { i } }));
    if (this.props.onStep && this.lastEmit !== i) { this.lastEmit = i; setTimeout(() => this.props.onStep && this.props.onStep(i), 0); }
  }

  renderVals() {
    const sc = SCENES[this.current()] || SCENES.bath;
    return { hostRef: this.hostRef, label: this.props.label || `Illustration: ${sc.label}` };
  }
}
</script>
